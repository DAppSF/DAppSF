{% extends 'base.html' %}
{% block body %}

<div class="container my-5" style="max-width: 1280px; font-family: 'Courier New', Courier, monospace;">
  <h1 class="h3 fw-bold text-success mb-4" style="letter-spacing: 2px;">// UPLOAD &amp; ANALYZE</h1>
<form action="{{ url_for('main.upload') }}" method="post" enctype="multipart/form-data" class="card">
  <div>
    <input type="file" id="file" name="file"/>
  </div>
  <button class="button" type="submit">Upload</button>
</form>

<div class="mt-5">
  <h2>Previous Scans</h2>
  {% if previous_scans %}
    <ul class="list-group rounded-0">
      {% for scan in previous_scans %}
        <li class="list-group-item bg-dark text-light border-secondary d-flex justify-content-between align-items-center rounded-0 mb-2">
          <div>
            <a href="{{ url_for('main.result', job_id=scan.job_id) }}" class="text-success fw-bold text-decoration-none">{{ scan.app_name }}</a>
            <span class="text-muted small ms-2">(Job ID: {{ scan.job_id }})</span>
          </div>
          <div class="btn-group">
            <a href="{{ url_for('main.download_pdf', job_id=scan.job_id) }}" class="btn btn-sm btn-outline-success rounded-0 me-2">Download Report</a>
            <form action="{{ url_for('main.delete_scan', job_id=scan.job_id) }}" method="post" style="display:inline;" onsubmit="return confirm('Are you sure you want to delete this scan?');">
              <button type="submit" class="btn btn-sm btn-outline-danger rounded-0">Delete</button>
            </form>
          </div>
        </li>
      {% endfor %}
    </ul>
  {% else %}
    <p>No previous scans found.</p>
  {% endif %}
</div>
</div>
{% endblock %}
